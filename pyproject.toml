[project]
name = "hybrid-attention-network-learning"
version = "0.1.0"
description = "Hybrid attention network for stock volatility prediction using social media text."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dask[dataframe]>=2024.0.0",
    "flashtext>=2.7",
    "gliner>=0.2.0",
    "joblib>=1.3.0",
    "matplotlib>=3.7.0",
    "numpy>=2.5.1",
    "pandas>=3.0.3",
    "pyarrow>=15.0.0",
    "scikit-learn>=1.3.0",
    "seaborn>=0.13.0",
    "torch>=2.13.0",
    "tqdm>=4.66.0",
    "transformers>=4.40.0",
    "yfinance>=0.2.40",
    "zstandard>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.uv]
default-groups = []
